name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
      - name: Install
        run: pip install numpy scipy matplotlib pytest
      - name: week01
        working-directory: week01/work
        run: pytest -q
      - name: week02
        working-directory: week02/work
        run: pytest -q
      - name: week03
        working-directory: week03/work
        run: pytest -q
      - name: week04
        working-directory: week04/work
        run: pytest -q
      - name: Interactive page vs weekly modules (Node.js)
        working-directory: web
        run: pytest -q
